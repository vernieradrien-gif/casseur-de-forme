<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône de Casseur de forme, tracée en code : la forme (triangle néon), un tir et le canon. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1b1442" />
      <stop offset="1" stop-color="#07070f" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <g transform="translate(256 256) scale(0.86) translate(-256 -256)">
    <polygon points="256,82 372,284 140,284" fill="#3ee6ff22" stroke="#3ee6ff" stroke-width="14" stroke-linejoin="round" filter="url(#glow)" />
    <polygon points="256,152 304,236 208,236" fill="none" stroke="#3ee6ff88" stroke-width="6" stroke-linejoin="round" />
    <circle cx="372" cy="284" r="11" fill="#fff6a0" filter="url(#glow)" />
    <polygon points="392,140 414,160 384,170" fill="#ff6bd6" />
    <polygon points="110,176 132,162 128,194" fill="#ffb347" />
    <polygon points="404,232 420,252 394,250" fill="#7cff6b" />
    <rect x="248" y="302" width="16" height="62" rx="8" fill="#ffffff" filter="url(#glow)" />
    <rect x="240" y="370" width="32" height="46" rx="6" fill="#10142a" stroke="#3ee6ff" stroke-width="8" />
    <circle cx="256" cy="430" r="40" fill="#10142a" stroke="#3ee6ff" stroke-width="10" filter="url(#glow)" />
    <circle cx="256" cy="430" r="15" fill="#3ee6ff" />
  </g>
</svg>
