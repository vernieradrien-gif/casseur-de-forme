apply plugin: 'com.android.application'

// Même numéro de version que le jeu (package.json, affiché dans les paramètres).
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version

android {
    // Paquet interne du code Java (inchangé) ; l'identifiant de l'application sur Google Play est applicationId.
    namespace = "io.github.vernieradrien.casseurdeforme"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Nom du package sur Google Play (définitif une fois l'application publiée).
        applicationId "io.github.vernieradrien.prismablast"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Numéro de version : fourni par GitHub Actions (numéro de construction) pour permettre les mises à jour.
        versionCode((System.getenv('VERSION_CODE') ?: '1').toInteger())
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signature avec une clé de TEST commitée dans le dépôt (casseur-test.keystore) :
    // pratique pour installer l'APK sur un téléphone, mais à NE PAS utiliser pour Google Play
    // (voir docs/publication.md pour créer la clé privée de publication).
    // Clé d'envoi Google Play (privée, hors du dépôt) : utilisée seulement si UPLOAD_KEYSTORE_FILE est défini,
    // avec UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS et UPLOAD_KEY_PASSWORD (voir docs/publication.md).
    def uploadKeystore = System.getenv('UPLOAD_KEYSTORE_FILE')
    signingConfigs {
        test {
            storeFile file('casseur-test.keystore')
            storePassword 'casseur-test'
            keyAlias 'casseur'
            keyPassword 'casseur-test'
        }
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD') ?: System.getenv('UPLOAD_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            signingConfig uploadKeystore ? signingConfigs.upload : signingConfigs.test
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Sauvegarde cloud avec le compte Google (Google Play Jeux).
    implementation "com.google.android.gms:play-services-games-v2:22.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
